---
name: "Stremio Server"
slug: "stremio-server"
version: "1.4.0"
version_str: "1.4.0"
description: "Self-hosted Stremio streaming server for Home Assistant"
url: "https://github.com/Mother-Goose/stremio-ha-addon"

# --- Build config — bump `args.VERSION` to update upstream ---
build:
  dockerfile: ./Dockerfile
  args:
    VERSION: "v4.20.3"
    JELLYFIN_VERSION: "4.4.1-4"

# --- Ports exposed to HA host ---
# 11470 = HTTP API, 8085 -> 8080 = Web UI (nginx), 12470 = HTTPS
ports:
  "11470/tcp": 11470
  "8085/tcp": 8080
  "12470/tcp": 12470

# --- Persistent data volume ---
# Map add-on private data directory → container /config/stremio (matches APP_PATH environment)
# This provides persistence for server-settings.json, etc. across container restarts
map:
  - type: app_config
    path: /config/stremio
    read_only: false

# --- Environment overrides (required internal paths, not user-configurable) ---
environment:
  APP_PATH: "/config/stremio"

# --- All user-configurable options from tsaridas/stremio-docker ---
# Appears in HA add-on Configuration editor.
# With legacy: true, these are passed as Docker env vars to the container.
options:
  # Core Stremio server
  FFMPEG_BIN: "/usr/bin/ffmpeg"
  FFPROBE_BIN: "/usr/bin/ffprobe"
  NO_CORS: "1"
  CASTING_DISABLED: "1"
  NODE_ENV: "production"

  # Web UI / HTTP
  WEBUI_LOCATION: "https://app.strem.io/shell-v4.4/"
  WEBUI_INTERNAL_PORT: 8080
  OPEN: ""
  SERVER_URL: ""
  AUTO_SERVER_URL: 1

  # Debugging
  HLS_DEBUG: ""
  DEBUG: ""
  DEBUG_MIME: ""
  DEBUG_FD: ""
  NODE_DEBUG: ""
  DISABLE_CACHING: ""
  READABLE_STREAM: ""

  # Certificate / HTTPS
  IPADDRESS: "87.74.111.100"
  DOMAIN: ""
  CERT_FILE: ""
  MAXATTEMPTS: 5
  HTTPS_CERT_ENDPOINT: "https://api.strem.io/api/certificateGet"

  # Authentication (optional)
  USERNAME: ""
  PASSWORD: ""

  # VA-API hardware acceleration
  VAAPI_PREFLIGHT: 1

schema:
  FFMPEG_BIN: str
  FFPROBE_BIN: str
  NO_CORS: str
  CASTING_DISABLED: str
  NODE_ENV: str
  WEBUI_LOCATION: str
  WEBUI_INTERNAL_PORT: int
  OPEN: str
  SERVER_URL: str
  AUTO_SERVER_URL: int
  HLS_DEBUG: str
  DEBUG: str
  DEBUG_MIME: str
  DEBUG_FD: str
  NODE_DEBUG: str
  DISABLE_CACHING: str
  READABLE_STREAM: str
  IPADDRESS: str
  DOMAIN: str
  CERT_FILE: str
  MAXATTEMPTS: int
  HTTPS_CERT_ENDPOINT: str
  USERNAME: str
  PASSWORD: password
  VAAPI_PREFLIGHT: int

# Required: pass options as Docker env vars to the container
legacy: true

# Required by HA add-on runtime
host_network: false
arch: [amd64, aarch64, armv7]