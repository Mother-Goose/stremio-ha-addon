---
name: "Stremio Server"
slug: "stremio-server"
version: "1.0.0"
version_str: "1.0.0"
description: "Self-hosted Stremio streaming server for Home Assistant"
url: "https://github.com/Mother-Goose/stremio-ha-addon"

# --- Build config — bump `args.VERSION` to update upstream ---
build:
  dockerfile: ./Dockerfile
  args:
    VERSION: "v4.20.3"
    JELLYFIN_VERSION: "4.4.1-4"

# --- Ports exposed to HA host ---
ports:
  "11470/tcp": 11470
  "12470/tcp": 12470

# --- Persistent data volume ---
# Map add-on private data directory → container /config/stremio (matches APP_PATH environment)
# This provides persistence for server-settings.json, etc. across container restarts
map:
  - type: app_config
    path: /config/stremio
    read_only: false

# --- Environment overrides ---
# IPADDRESS can be set in HA's add-on Configuration editor → options.
# Without legacy:true, options are stored but NOT passed as Docker env vars.
# To enable IPADDRESS as a Docker env var, set legacy: true below.
environment:
  NO_CORS: "1"
  APP_PATH: "/config/stremio"
  IPADDRESS: ""

# --- User-configurable options (appears in HA add-on Configuration editor) ---
options:
  IPADDRESS: ""

# For legacy apps, options are passed as Docker environment variables.
# Uncomment the next line to enable IPADDRESS→env-var mapping.
legacy: true

# Required by HA add-on runtime
host_network: false
arch: [amd64, aarch64, armv7]