---
name: "Stremio Server"
slug: "stremio-server"
version: "1.0.0"
version_str: "1.0.0"
description: "Self-hosted Stremio streaming server for Home Assistant"
url: "https://github.com/Mother-Goose/stremio-ha-addon"

# --- Build config — bump `args.VERSION` to update upstream ---
build:
  dockerfile: ./Dockerfile
  args:
    VERSION: "v4.20.3"
    JELLYFIN_VERSION: "4.4.1-4"

# --- Ports exposed to HA host ---
ports:
  "11470/tcp": 11470
  "12470/tcp": 12470

# --- Environment overrides ---
environment:
  NO_CORS: "1"
  APP_PATH: "/config/stremio"

# --- Persistent data volume ---
# Map add-on private data directory → container /root/.stremio-server
map:
  - type: data
    path: /root/.stremio-server
    read_only: false

# Required by HA add-on runtime
host_network: false
arch: [amd64, arm64, armv7]