---
name: "Stremio Server"
slug: "stremio-server"
version: "1.0.0"
version_str: "1.0.0"
description: "Self-hosted Stremio streaming server for Home Assistant"
url: "https://github.com/Mother-Goose/stremio-ha-addon"

# --- Build config — bump `args.VERSION` to update upstream ---
build:
  dockerfile: ./Dockerfile
  args:
    VERSION: "v4.20.3"
    JELLYFIN_VERSION: "4.4.1-4"

# --- Ports exposed to HA host ---
ports:
  "11470/tcp": 11470
  "12470/tcp": 12470

# --- Persistent data volume ---
# Map add-on private data directory → container /config/stremio (matches APP_PATH environment)
# This provides persistence for server-settings.json, etc. across container restarts
map:
  - type: app_config
    path: /config/stremio
    read_only: false

# --- Environment overrides ---
# NO_CORS and APP_PATH are required for HA compatibility.
# IPADDRESS is optional — set via HA add-on Configuration editor → options.
# When legacy: true (set below), user-set options override environment defaults
# and are passed to the container as Docker environment variables.
environment:
  NO_CORS: "1"
  APP_PATH: "/config/stremio"

# --- User-configurable options (appears in HA add-on Configuration editor) ---
# When legacy: true, these option values are passed as Docker environment
# variables and reach the Stremio server process.
options:
  IPADDRESS: ""

schema:
  IPADDRESS: str

# For legacy apps, options are passed as Docker environment variables.
# Set legacy: true so IPADDRESS set in HA UI is forwarded to the container.
legacy: true

# Required by HA add-on runtime
host_network: false
arch: [amd64, aarch64, armv7]